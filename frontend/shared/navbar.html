<header class="topbar">
            <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>

            <div class="topbar-left">
                <div class="greeting">
                    <h1>Good Morning, <span id="ownerName">Gayatri</span> 👋</h1>
                    <span class="managing-pill">Managing <strong id="managingPetName">Bruno</strong></span>
                </div>
            </div>

            <div class="topbar-right">
                <div class="search-box">
                    <span>⌕</span>
                    <input type="search" placeholder="Search records..." aria-label="Search records">
                    <kbd>⌘K</kbd>
                </div>
                
<button class="icon-button notification-button" id="notificationButton" aria-label="Notifications">
    <svg
        class="notification-icon"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >
        <path
            d="M18 8C18 4.686 15.314 2 12 2C8.686 2 6 4.686 6 8C6 13 4 15 3 17H21C20 15 18 13 18 8Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
        <path
            d="M10 21H14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        />
    </svg>

    <span class="notification-count">2</span>
</button>

                <div class="profile-wrap">

    <button
        class="profile-button"
        id="profileButton"
        type="button"
        aria-label="Open profile menu"
    >

        <span
            class="profile-avatar"
            id="profileAvatar"
        >G</span>

        <span
            class="profile-name"
            id="profileName"
        >Gayatri</span>

       <span class="chevron" aria-hidden="true">
    <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >
        <path
            d="M6 9L12 15L18 9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </svg>
</span>

    </button>

    <div
        class="profile-menu"
        id="profileMenu"
    >
        <button
    type="button"
    id="profileMenuItem"
>
    👤 Profile
</button>

        <button
    type="button"
    id="settingsMenuItem"
>
    ⚙️ Settings
</button>

        <button
    type="button"
    id="logoutMenuItem"
>
    🚪 Logout
</button>
    </div>

</div>
        </header>
