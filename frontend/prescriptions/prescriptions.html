<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions | PawSync</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850&display=swap" rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../shared/css/variables.css">
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="../shared/css/responsive.css">

    <!-- Prescriptions CSS -->
    <link rel="stylesheet" href="prescriptions.css">
</head>

<body data-shared-path="../shared">

    <!-- Shared Navbar -->
    <div id="navbar-container"></div>

    <!-- Page Layout -->
    <div class="page-layout">

        <!-- Shared Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="page-container">

                <!-- Header -->
                <header class="page-header">
                    <div>
                        <span class="eyebrow">DIGITAL CLINICAL RECORDS</span>
                        <h1>Prescriptions 💊</h1>
                        <p class="subtitle">All digital prescriptions saved and organized by pet</p>
                    </div>
                </header>

                <!-- Pet Selector Tabs -->
                <div class="pet-filter-bar">
                    <span class="filter-label">Filter by Pet:</span>
                    <div id="petFilterTabs" class="pet-tabs">
                        <button class="pet-tab-btn active" data-pet-id="all">
                            <span>🐾</span> All Pets
                        </button>
                    </div>
                </div>

                <!-- Prescriptions Grid -->
                <div id="prescriptionsGrid" class="prescriptions-grid">
                    <div class="loading-state">
                        <span>⏳ Loading digital prescriptions...</span>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- Rx Detail / Print Modal -->
    <div id="rxModal" class="modal-overlay" style="display:none;">
        <div class="rx-modal-card">
            <button class="modal-close-btn" onclick="closeRxModal()">✕</button>
            <div id="rxModalContent" class="rx-document">
                <!-- Dynamically populated -->
            </div>
            <div class="modal-actions">
                <button class="btn-download" onclick="downloadPrescription()">📥 Download Prescription</button>
                <button class="btn-close" onclick="closeRxModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Shared JS -->
    <script src="../shared/js/shared.js"></script>

    <!-- Page JS -->
    <script src="prescriptions.js"></script>

</body>
</html>
