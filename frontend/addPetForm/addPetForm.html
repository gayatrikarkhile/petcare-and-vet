<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawSync - Add New Pet</title>
  <link rel="stylesheet" href="addPetForm.css">
  <script src="addPetForm.js" defer></script>
</head>
<body>

  <div class="page-wrapper">
    <div class="pet-form-card">
      
      <!-- HEADER WITH COMPACT BACK BUTTON -->
      <header class="form-header">
        <a href="../owner/dashboard/ownerdashboard.html" class="back-link">
          <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Go to Dashboard</span>
        </a>

        <div class="header-title-group">
          <div class="header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
          <h1>Add New Pet Profile</h1>
        </div>
        <p class="subtitle">Fill in the details below to add a pet to your PawSync dashboard.</p>
      </header>

      <form id="petForm" novalidate>
        
        <!-- BASIC INFORMATION -->
        <div class="section-title">Basic Information</div>
        <div class="form-grid">
          
          <!-- Pet Name -->
          <div class="form-group" id="group-petName">
            <label for="petName">Pet Name <span class="req">*</span></label>
            <input type="text" id="petName" name="petName" placeholder="e.g. Luna" required>
            <span class="error-message" id="error-petName"></span>
          </div>

          <!-- Species -->
          <div class="form-group" id="group-species">
            <label for="species">Species <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="species" name="species" required>
                <option value="" disabled selected>Select species...</option>

                <option value="Dog">Dog</option>
<option value="Cat">Cat</option>
<option value="Bird">Bird</option>
<option value="Fish">Fish</option>
<option value="Rabbit">Rabbit</option>
<option value="Horse">Horse</option>
<option value="Turtle">Turtle</option>
<option value="Other">Other</option>
              </select>
              <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
            <span class="error-message" id="error-species"></span>
          </div>

          <!-- Searchable Breed Dropdown -->
          <div class="form-group" id="group-breed">
            <label for="breedInput">Breed <span class="req">*</span></label>
            <div class="searchable-select">
              <input type="text" id="breedInput" placeholder="Type or select breed..." autocomplete="off" disabled required>
              <div class="dropdown-list" id="breedDropdownList" style="display: none;"></div>
            </div>
            <span class="error-message" id="error-breedInput"></span>
          </div>

          <!-- Gender Segmented Toggle -->
          <div class="form-group" id="group-gender">
            <label>Gender <span class="req">*</span></label>
            <div class="segmented-control">
              <label class="segmented-option">
                <input type="radio" name="gender" value="Male">
                <span class="segmented-label">Male</span>
              </label>
              <label class="segmented-option">
                <input type="radio" name="gender" value="Female">
                <span class="segmented-label">Female</span>
              </label>
            </div>
            <span class="error-message" id="error-gender"></span>
          </div>

<!-- =========================================
     REPRODUCTIVE STATUS
========================================= -->

<div
    class="form-group"
    id="group-reproductiveStatus"
>

    <label for="reproductiveStatus">
        Reproductive Status
        <span class="req">*</span>
    </label>

    <select
        id="reproductiveStatus"
        name="reproductiveStatus"
        required
    >

        <option value="">
            Select gender first
        </option>

    </select>

    <span
        class="error-message"
        id="error-reproductiveStatus"
    ></span>

</div>

          <!-- Date of Birth / Adoption -->
          <div class="form-group" id="group-dob">
            <label for="dob">Date of Birth / Adoption Date <span class="req">*</span></label>
            <input type="date" id="dob" name="dob" required>
            <span class="error-message" id="error-dob"></span>
          </div>

          <!-- Weight -->
          <div class="form-group" id="group-weight">
            <label for="weight">Weight <span class="req">*</span></label>

          <!-- Owner Contact Number -->
          <div class="form-group" id="group-ownerPhone">
            <label for="ownerPhone">📱 Owner Contact Number <span class="req">*</span></label>
            <input type="tel" id="ownerPhone" name="ownerPhone" placeholder="e.g. +1 555 123 4567" required>
            <span class="error-message" id="error-ownerPhone"></span>
          </div>
            <div class="weight-input-group">
              <input type="number" id="weight" name="weight" step="0.1" min="0.1" placeholder="0.0" required>
              <select id="weightUnit" name="weightUnit" class="unit-select">
                <option value="kg">kg</option>
                <option value="lbs">lbs</option>
              </select>
            </div>
            <span class="error-message" id="error-weight"></span>
          </div>

          <!-- Microchip ID -->
          <div class="form-group full-width" id="group-microchip">
            <label for="microchip">Microchip ID (Optional)</label>
            <input type="text" id="microchip" name="microchip" placeholder="15-digit microchip number">
            <span class="error-message" id="error-microchip"></span>
          </div>

        </div>

        <div class="section-divider"></div>

        <!-- MEDICAL & PROFILE DETAILS -->
        <div class="section-title">Medical & Details</div>
        <div class="form-grid">

          <!-- Photo Drag & Drop Upload -->
          <div class="form-group full-width" id="group-photo">
            <label>Profile Photo</label>
            <div class="upload-container" id="uploadContainer">
              <input type="file" id="photoInput" accept="image/*" hidden>
              
              <!-- Empty Dropzone State -->
              <div class="upload-dropzone" id="uploadDropzone">
                <div class="upload-icon-circle">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                </div>
                <p class="upload-text"><strong>Click to upload</strong> or drag & drop image</p>
                <p class="upload-subtext">PNG, JPG or WEBP (Max 5MB)</p>
              </div>

              <!-- Filled Preview State -->
              <div class="upload-preview" id="uploadPreview" style="display: none;">
                <div class="preview-avatar-wrapper">
                  <img id="previewImg" src="" alt="Pet Preview">
                </div>
                <div class="preview-actions">
                  <button type="button" class="btn-change-photo" id="btnChangePhoto">Change</button>
                  <button type="button" class="btn-remove-photo" id="btnRemovePhoto">Remove</button>
                </div>
              </div>

            </div>
          </div>

          <!-- Medical History / Conditions Tags -->
          <div class="form-group full-width" id="group-tags">
            <label for="tagInput">Medical Conditions & Tags</label>
            <div class="tag-input-container" id="tagContainer">
              <div class="tags-wrapper" id="tagsWrapper"></div>
              <input type="text" id="tagInput" placeholder="Type condition and press Enter...">
            </div>
            <p class="input-hint">Press Enter or comma to create a chip tag</p>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="btnSubmit">
            <span>Save Pet Profile</span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- FLOATING TOAST NOTIFICATION -->
  <div class="toast-container">
    <div class="toast" id="toast">
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <span class="toast-message" id="toastMessage">Pet added successfully!</span>
    </div>
  </div>

</body>
</html>
