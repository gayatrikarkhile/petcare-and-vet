<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | PawSync Vet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../vet-assets/vet-style.css">
</head>
<body data-vetpage="dashboard">
  <header class="vet-topbar" id="vet-topbar"></header>
  <aside class="vet-sidebar" id="vet-sidebar"></aside>

  <main class="vet-main">
    <!-- Header -->
    <div class="vet-page-head">
      <div>
        <div class="vet-eyebrow">🩺 Veterinary Practice Dashboard</div>
        <h1 id="vet-greeting-title">Good Morning, Doctor 👋</h1>
        <p class="vet-subtitle">Here's what's happening with your practice today.</p>
      </div>
      <div>
        <button class="vet-primary" onclick="location.href='vet-appointments.html'">📅 Manage Appointments</button>
      </div>
    </div>

    <!-- Profile Completion Prompt Banner (Renders if profile incomplete) -->
    <div id="vet-profile-prompt-container"></div>

    <!-- Statistics Cards -->
    <div class="vet-grid vet-stats" id="vet-stats-grid" style="margin-bottom: 28px;">
      <!-- Dynamic Stats Rendered by vet-app.js -->
    </div>

    <!-- Two-column Layout -->
    <div class="vet-grid vet-two">
      <!-- Left Column: Appointment Requests -->
      <section class="vet-card">
        <div class="vet-card-title">
          <h2>🔔 Appointment Requests</h2>
          <a href="vet-appointments.html" style="color:var(--teal);font-weight:700;font-size:13px;text-decoration:none;">View all →</a>
        </div>
        <div id="vet-requests-list">
          <!-- Rendered dynamically -->
        </div>
      </section>

      <!-- Right Column: Recent Patients -->
      <section class="vet-card">
        <div class="vet-card-title">
          <h2>🐾 Recent Patients</h2>
          <a href="vet-patients.html" style="color:var(--teal);font-weight:700;font-size:13px;text-decoration:none;">My Patients →</a>
        </div>
        <div class="vet-grid" id="vet-recent-patients">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </div>
  </main>

  <script src="../vet-assets/vet-app.js"></script>
</body>
</html>
